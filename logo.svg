<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="clawGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B4A"/>
      <stop offset="50%" style="stop-color:#FF8C42"/>
      <stop offset="100%" style="stop-color:#FFA94D"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Lobster Claw Icon -->
  <g transform="translate(8, 8) scale(0.9)">
    <!-- Main claw body -->
    <path d="M22 8C18 6 12 8 10 14C8 20 12 26 18 28C22 29 26 28 28 24C30 20 28 14 24 12C22 11 20 10 22 8Z" 
          fill="url(#clawGradient)" filter="url(#shadow)"/>
    
    <!-- Claw pincer top -->
    <path d="M24 12C28 10 32 12 34 16C36 20 34 26 30 28C28 29 26 28 24 26" 
          fill="url(#clawGradient)" stroke="#E85D3E" stroke-width="0.5"/>
    
    <!-- Claw pincer bottom -->
    <path d="M22 26C24 28 28 30 32 28C36 26 38 22 36 18" 
          fill="url(#clawGradient)" stroke="#E85D3E" stroke-width="0.5"/>
    
    <!-- Inner claw detail -->
    <path d="M20 16C22 14 26 14 28 16C30 18 30 22 28 24" 
          fill="none" stroke="#FFE4D6" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Chain link accent (representing blockchain/reputation) -->
    <circle cx="14" cy="18" r="3" fill="#0052FF" opacity="0.9"/>
    <circle cx="14" cy="18" r="1.5" fill="white"/>
    
    <!-- Small decorative dots (reputation stars) -->
    <circle cx="32" cy="10" r="1.5" fill="#FFD700"/>
    <circle cx="36" cy="14" r="1" fill="#FFD700"/>
    <circle cx="34" cy="8" r="0.8" fill="#FFD700"/>
  </g>
  
  <!-- ARP Text -->
  <g transform="translate(48, 18)">
    <text x="0" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="28" font-weight="800" fill="url(#textGradient)" letter-spacing="-1">
      ARP
    </text>
    <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" 
          font-size="9" font-weight="500" fill="#666" letter-spacing="0.5">
      AGENT REPUTATION PROTOCOL
    </text>
  </g>
  
  <!-- Base chain accent line -->
  <line x1="48" y1="42" x2="185" y2="42" stroke="#0052FF" stroke-width="2" opacity="0.3"/>
</svg>