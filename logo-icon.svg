<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B4A"/>
      <stop offset="50%" style="stop-color:#FF8C42"/>
      <stop offset="100%" style="stop-color:#FFA94D"/>
    </linearGradient>
    <linearGradient id="iconGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C69"/>
      <stop offset="100%" style="stop-color:#FFB347"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle (optional, for icon use) -->
  <circle cx="24" cy="24" r="22" fill="#1a1a2e"/>
  
  <!-- Lobster Claw -->
  <g transform="translate(24, 24) scale(1.3) translate(-24, -24) translate(4, 2)">
    <!-- Main claw body -->
    <path d="M22 8C18 6 12 8 10 14C8 20 12 26 18 28C22 29 26 28 28 24C30 20 28 14 24 12C22 11 20 10 22 8Z" 
          fill="url(#iconGradient)"/>
    
    <!-- Claw pincer top -->
    <path d="M24 12C28 10 32 12 34 16C36 20 34 26 30 28C28 29 26 28 24 26" 
          fill="url(#iconGradient)" stroke="#E85D3E" stroke-width="0.5"/>
    
    <!-- Claw pincer bottom -->
    <path d="M22 26C24 28 28 30 32 28C36 26 38 22 36 18" 
          fill="url(#iconGradient)" stroke="#E85D3E" stroke-width="0.5"/>
    
    <!-- Inner detail -->
    <path d="M20 16C22 14 26 14 28 16C30 18 30 22 28 24" 
          fill="none" stroke="#FFE4D6" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Chain/reputation dot -->
    <circle cx="14" cy="18" r="3" fill="#0052FF"/>
    <circle cx="14" cy="18" r="1.5" fill="white"/>
    
    <!-- Stars for reputation -->
    <circle cx="32" cy="10" r="1.5" fill="#FFD700"/>
    <circle cx="36" cy="14" r="1" fill="#FFD700"/>
  </g>
</svg>