<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="clawGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C69"/>
      <stop offset="50%" style="stop-color:#FFA07A"/>
      <stop offset="100%" style="stop-color:#FFB347"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Lobster Claw Icon -->
  <g transform="translate(8, 8) scale(0.9)">
    <path d="M22 8C18 6 12 8 10 14C8 20 12 26 18 28C22 29 26 28 28 24C30 20 28 14 24 12C22 11 20 10 22 8Z" 
          fill="url(#clawGradientDark)"/>
    <path d="M24 12C28 10 32 12 34 16C36 20 34 26 30 28C28 29 26 28 24 26" 
          fill="url(#clawGradientDark)" stroke="#FFAA80" stroke-width="0.5"/>
    <path d="M22 26C24 28 28 30 32 28C36 26 38 22 36 18" 
          fill="url(#clawGradientDark)" stroke="#FFAA80" stroke-width="0.5"/>
    <path d="M20 16C22 14 26 14 28 16C30 18 30 22 28 24" 
          fill="none" stroke="#FFE4D6" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="14" cy="18" r="3" fill="#4A9EFF" filter="url(#glow)"/>
    <circle cx="14" cy="18" r="1.5" fill="white"/>
    <circle cx="32" cy="10" r="1.5" fill="#FFD700"/>
    <circle cx="36" cy="14" r="1" fill="#FFD700"/>
  </g>
  
  <!-- ARP Text - White for dark backgrounds -->
  <g transform="translate(48, 18)">
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" 
          font-size="28" font-weight="800" fill="white" letter-spacing="-1">
      ARP
    </text>
    <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" 
          font-size="9" font-weight="500" fill="#aaa" letter-spacing="0.5">
      AGENT REPUTATION PROTOCOL
    </text>
  </g>
  
  <line x1="48" y1="42" x2="185" y2="42" stroke="#4A9EFF" stroke-width="2" opacity="0.5"/>
</svg>